name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No OpenRouter keys in the repository
        run: "! git grep -nE 'sk-or-[A-Za-z0-9]{20,}' -- ."
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
